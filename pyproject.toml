[project]
name = "krita-art-mcp"
version = "0.17.0"
description = "MCP server that lets AI agents paint in Krita"
keywords = [
    "krita",
    "krita-plugin",
    "krita-mcp",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "ai-agents",
    "game-art",
    "digital-painting",
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26,<5",
    "mcp>=2.3,<2.4",
    "numpy>=2,<3",
    "pillow>=13,<14",
]

[project.scripts]
krita-art-mcp = "krita_art_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
    "types-jsonschema>=4.26",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]
per-file-target-version = { "plugin/**/*.py" = "py310", "tests/plugin/**/*.py" = "py310", "tests/fixtures/**/*.py" = "py310" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
# Tests import the plugin's core as `bridge_core`; the 3.10 run checks the whole package.
mypy_path = ["plugin/krita_art_mcp_bridge", "plugin", "scripts", "tests/fixtures", "tests/support"]
exclude = ["^docs/"]

[[tool.mypy.overrides]]
module = ["krita", "krita.*", "PyQt5", "PyQt5.*", "PyQt6", "PyQt6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Krita's and Qt's classes and decorators are untyped, and the adapter must use them.
module = ["krita_art_mcp_bridge.krita_adapter.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures stays valid on 3.10 for the plugin's tests; tests/support is the server's.
pythonpath = ["plugin/krita_art_mcp_bridge", "scripts", "tests/fixtures", "tests/support"]
addopts = ["--import-mode=importlib"]
